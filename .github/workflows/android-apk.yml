# ============================================================
# Compilar el APK de Android
# ------------------------------------------------------------
# GitHub > pestaña Actions > "2. Compilar APK Android" > Run workflow.
# Cuando termina, el APK queda en "Artifacts" al pie de la ejecución
# (y también en Releases si marcaste "publicar release").
# ============================================================
name: 2. Compilar APK Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Número de versión visible (ej: 1.0.3)"
        required: true
        default: "1.0.0"
      release:
        description: "¿Publicar en Releases para compartir el link?"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_N8N_SEND_WEBHOOK: ${{ secrets.VITE_N8N_SEND_WEBHOOK }}
          VITE_GROK_API_KEY: ${{ secrets.VITE_GROK_API_KEY }}
          VITE_AZURE_SPEECH_KEY: ${{ secrets.VITE_AZURE_SPEECH_KEY }}
          VITE_AZURE_SPEECH_REGION: ${{ secrets.VITE_AZURE_SPEECH_REGION }}

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Colocar google-services.json (Firebase)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json colocado — las notificaciones push van a funcionar."
          else
            echo "::warning::Falta el secret GOOGLE_SERVICES_JSON. El APK se compila igual, pero SIN notificaciones push."
          fi

      - name: Preparar la llave de firma
        id: firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/munich-crm.jks"
            echo "firmado=si" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Falta ANDROID_KEYSTORE_BASE64. Se genera un APK de debug (instalable, pero no sirve para Play Store)."
            echo "firmado=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar APK firmado
        if: steps.firma.outputs.firmado == 'si'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/munich-crm.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ inputs.version || github.ref_name }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../NuevoMunichCRM.apk

      - name: Compilar APK de debug (sin llave de firma)
        if: steps.firma.outputs.firmado == 'no'
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ inputs.version || github.ref_name }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../NuevoMunichCRM.apk

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: NuevoMunichCRM-apk
          path: NuevoMunichCRM.apk

      - name: Publicar en Releases (link para compartir)
        if: inputs.release || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version || github.ref_name }}
          name: Nuevo Munich CRM ${{ inputs.version || github.ref_name }}
          body: |
            APK de la app Nuevo Munich CRM para Android.

            **Cómo instalar:**
            1. Descargá `NuevoMunichCRM.apk` desde acá abajo.
            2. Abrilo. Si Android avisa que no permite instalar de esta fuente,
               tocá "Ajustes" y activá el permiso para el navegador o WhatsApp.
            3. Instalá, abrí, iniciá sesión y aceptá las notificaciones.
          files: NuevoMunichCRM.apk
