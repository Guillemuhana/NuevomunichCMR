# ============================================================
# Crear la llave de firma del APK (SE EJECUTA UNA SOLA VEZ)
# ------------------------------------------------------------
# GitHub > pestaña Actions > "1. Crear llave de firma (una sola vez)"
# > Run workflow. Al terminar, copiá el texto que imprime y guardalo
# como secrets del repositorio. GUARDÁ TAMBIÉN el archivo .jks:
# si lo perdés no vas a poder publicar actualizaciones del APK.
# ============================================================
name: 1. Crear llave de firma (una sola vez)

on:
  workflow_dispatch:
    inputs:
      password:
        description: "Contraseña para la llave (anotala, la vas a necesitar)"
        required: true

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generar keystore
        run: |
          keytool -genkeypair -v \
            -keystore munich-crm.jks \
            -alias munich \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.password }}" \
            -keypass "${{ inputs.password }}" \
            -dname "CN=Nuevo Munich, OU=CRM, O=Nuevo Munich, L=Cordoba, S=Cordoba, C=AR"

      - name: Mostrar el valor para el secret
        run: |
          echo "=================================================="
          echo "Guardá estos 4 secrets en:"
          echo "Settings > Secrets and variables > Actions > New repository secret"
          echo "=================================================="
          echo ""
          echo "ANDROID_KEYSTORE_BASE64 = (el contenido de abajo, todo junto)"
          echo ""
          base64 -w 0 munich-crm.jks
          echo ""
          echo ""
          echo "ANDROID_KEYSTORE_PASSWORD = la contraseña que pusiste"
          echo "ANDROID_KEY_ALIAS         = munich"
          echo "ANDROID_KEY_PASSWORD      = la misma contraseña"

      - name: Guardar el .jks como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: keystore-GUARDAR-EN-LUGAR-SEGURO
          path: munich-crm.jks
          retention-days: 7
