<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#B91C1C" />
    <title>Nuevo Munich · CRM</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html { height: 100%; overflow: hidden; }
      body {
        height: 100%; margin: 0; overflow: hidden; overflow-x: hidden; overscroll-behavior: none;
        font-family: 'Inter Variable', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        background: #F7F8FA; color: #101828;
        /* Android 15 dibuja la app por debajo de la barra de estado (edge-to-edge):
           le reservamos su alto para que no tape la cabecera. En la web vale 0. */
        padding-top: env(safe-area-inset-top);
      }

      /* Franja de la barra de estado, pintada del rojo de la marca para que
         se vea como parte de la app y no como un recorte. */
      body::before {
        content: ""; position: fixed; top: 0; left: 0; right: 0;
        height: env(safe-area-inset-top);
        background: #A81F1F; z-index: 9999; pointer-events: none;
      }

      /* ── Refinamientos minimalistas ── */
      ::selection { background: rgba(168,31,31,.14); }
      button, input, textarea, select { font-family: inherit; }
      button { -webkit-tap-highlight-color: transparent; }
      :focus-visible { outline: 2px solid rgba(168,31,31,.45); outline-offset: 2px; }

      /* Scrollbars finas y discretas */
      * { scrollbar-width: thin; scrollbar-color: #D3D8E0 transparent; }
      *::-webkit-scrollbar { width: 8px; height: 8px; }
      *::-webkit-scrollbar-track { background: transparent; }
      *::-webkit-scrollbar-thumb { background: #D3D8E0; border-radius: 99px; border: 2px solid transparent; background-clip: content-box; }
      *::-webkit-scrollbar-thumb:hover { background: #B6BDC9; background-clip: content-box; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      }
      #root { height: 100%; display: flex; flex-direction: column; overflow: hidden; }
      /* Login puede scrollear aunque el root esté locked */
      .login-scroll { overflow-y: auto !important; -webkit-overflow-scrolling: touch; }

      /* iOS scroll nativo */
      .scroll-y { overflow-y: auto; -webkit-overflow-scrolling: touch; }
      /* Ocultar scrollbar en strips horizontales */
      .strip::-webkit-scrollbar { display: none; }
      .strip { -ms-overflow-style: none; scrollbar-width: none; }

      /* ── Layout responsive principal ── */
      .app-layout  { display: flex; height: 100%; overflow: hidden; }
      .app-sidebar { flex-shrink: 0; width: 368px; height: 100%; }
      .app-main    { flex: 1; min-width: 0; height: 100%; overflow: hidden; display: flex; flex-direction: column; }

      /* Barras de acciones: nunca desbordan, se envuelven en pantallas chicas */
      .barra-acciones { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }

      /* Logo de la cabecera del panel de vendedor: grande, pero sin comerse
         el alto de la barra en un celular. */
      .logo-vendedor { height: 68px; width: auto; max-width: 42vw; object-fit: contain; flex-shrink: 0; display: block; }
      .header-vendedor { padding: 8px 18px; }
      @media (max-width: 767px) {
        .logo-vendedor  { height: 80px; }
        .header-vendedor { padding: 6px 12px !important; gap: 10px !important; }
      }
      /* Celulares angostos: el logo manda, el rótulo "Panel de vendedor"
         sobra —queda el nombre— y así los botones nunca se apretujan. */
      @media (max-width: 430px) {
        .logo-vendedor { height: 72px; }
        .titulo-panel  { display: none !important; }
      }

      /* Línea de producto del pedido. En escritorio entra todo en un renglón;
         en celular el nombre del producto se lleva el ancho entero y la
         cantidad queda debajo, que si no el nombre se corta a la mitad. */
      .linea-pedido { display: flex; gap: 8px; align-items: center; margin-bottom: 7px; }
      @media (max-width: 640px) {
        .linea-pedido { flex-wrap: wrap; gap: 7px; padding-bottom: 9px; border-bottom: 1px solid #F0F2F5; }
        .linea-pedido .prod-selector { order: -1; flex: 0 0 100%; width: 100%; }
        .linea-pedido .prod-borrar { margin-left: auto; }
      }

      @media (max-width: 767px) {
        /* Etiqueta de botón que se esconde en celular: queda solo el ícono */
        .solo-desktop { display: none !important; }
        /* Sin texto, el botón pasa a ser cuadrado y no desborda la barra */
        .btn-compacto { padding-left: 10px !important; padding-right: 10px !important; gap: 0 !important; }
      }

      @media (max-width: 767px) {
        /* Mobile: sidebar ocupa todo, panel oculto */
        .app-sidebar { width: 100% !important; min-width: 0 !important; }
        .app-main    { display: none !important; }

        /* Cuando hay un panel activo: ocultar sidebar, mostrar panel */
        .in-panel .app-sidebar { display: none !important; }
        .in-panel .app-main    { display: flex !important; flex: 1; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
